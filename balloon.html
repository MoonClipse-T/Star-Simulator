   검정 바탕 + 실제 천체 사진 + 강조색 하나(호박색). 그라데이션·글래스·네온·둥근 카드 금지. */
:root{
  --bg:#060607; --bg2:#0d0d0f; --ink:#edeae3; --mute:#9b978f; --dim:#5f5c56;
  --line:rgba(237,234,227,.16); --line2:rgba(237,234,227,.32);
  --acc:#f2a33a; --acc-ink:#140c02;
  --head:"Head","Malgun Gothic",sans-serif;
  --body:"Body","Malgun Gothic",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--ink);font-family:var(--body);
  word-break:keep-all;overflow-wrap:break-word;touch-action:none;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
b,strong{font-weight:700;color:#fff}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1600px;height:900px;background:var(--bg);transform-origin:center center;overflow:hidden;flex:none}

/* ---------- slide ---------- */
.slide{position:absolute;inset:0;padding:112px 88px 72px;opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility 0s .35s}
.slide.active{opacity:1;visibility:visible;transition:opacity .35s var(--ease),visibility 0s 0s;z-index:1}
[data-step]{opacity:0;transform:translateY(8px);transition:opacity .2s var(--ease),transform .2s var(--ease)}
[data-step].on{opacity:1;transform:none}
[data-step].dimmed{opacity:.35}

/* ---------- chrome ---------- */
#chrome{position:absolute;inset:0;pointer-events:none;z-index:50}
#chrome .unit{position:absolute;left:88px;top:44px;font-size:15px;letter-spacing:.14em;color:var(--mute);display:flex;gap:14px;align-items:center}
#chrome .unit i{display:inline-block;width:28px;height:1px;background:var(--line2)}
#chrome .unit b{color:var(--ink);font-weight:700;letter-spacing:.06em}
#chrome .page{position:absolute;right:88px;top:44px;font-size:15px;letter-spacing:.14em;color:var(--mute);font-variant-numeric:tabular-nums}
#chrome .page b{color:var(--ink)}
#chrome .credit{position:absolute;left:88px;bottom:26px;font-size:12px;color:var(--dim);letter-spacing:.02em;max-width:900px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chrome .nav{position:absolute;right:76px;bottom:18px;display:flex;gap:2px;pointer-events:auto}
#chrome .nav button{width:44px;height:36px;border:0;background:transparent;color:var(--mute);font:16px var(--body);cursor:pointer}
#chrome .nav button:hover{color:var(--ink)}
#chrome .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--acc);transition:width .35s var(--ease)}
#chrome .pager{display:none;position:absolute;left:50%;top:24px;translate:-50% 0;align-items:center;gap:6px;pointer-events:auto;background:rgba(6,6,7,.86);border:1px solid var(--line2);padding:6px}
#chrome .pager button{min-width:76px;height:64px;border:0;background:transparent;color:var(--ink);font:30px var(--body);padding:0 18px;cursor:pointer;white-space:nowrap;touch-action:manipulation}
#chrome .pager button.end{font-size:22px;font-weight:700;color:var(--acc)}
#chrome .pager .dots{display:flex;gap:8px;padding:0 6px}
#chrome .pager .dots:empty{display:none}
#chrome .pager .dots i{width:11px;height:11px;border-radius:50%;background:var(--line2)}
#chrome .pager .dots i.on{background:var(--acc)}
.simslide #chrome .pager{display:flex}.simslide #chrome .nav,.solo #chrome .pager{display:none}
.slide.cover~#chrome .unit,.hide-chrome #chrome .unit,.hide-chrome #chrome .page{opacity:0}

/* ---------- type ---------- */
.kicker{font-size:17px;letter-spacing:.2em;color:var(--acc);font-weight:700;margin:0 0 18px}
.display{font-family:var(--head);font-size:168px;line-height:.98;letter-spacing:-.01em;margin:0;font-weight:normal}
h2{font-family:var(--head);font-size:70px;line-height:1.08;margin:0 0 28px;font-weight:normal;letter-spacing:-.005em}
h3{font-family:var(--head);font-size:42px;line-height:1.15;margin:0 0 14px;font-weight:normal}
.lead{font-size:32px;line-height:1.55;margin:0 0 22px;color:var(--ink)}
p{font-size:27px;line-height:1.62;margin:0 0 18px;color:#d9d6cf}
.small{font-size:21px;line-height:1.55;color:var(--mute)}
.micro{font-size:15px;letter-spacing:.08em;color:var(--mute)}
.acc{color:var(--acc)}
.num{font-family:var(--head);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
hr.rule{border:0;border-top:1px solid var(--line);margin:28px 0}
mark{background:none;color:var(--acc);font-weight:700}

/* ---------- layout ---------- */
.row{display:flex;gap:56px}
.col{flex:1;min-width:0}
.split{display:grid;grid-template-columns:7fr 5fr;gap:64px;height:100%}
.split.rev{grid-template-columns:5fr 7fr}
.split.half{grid-template-columns:1fr 1fr}
.vcenter{display:flex;flex-direction:column;justify-content:center}
.bottom{display:flex;flex-direction:column;justify-content:flex-end}
.fill{position:absolute;inset:0}

/* ---------- photo ---------- */
.bleed{position:absolute;inset:0;z-index:-1;overflow:hidden;background:#000}
.bleed img,.bleed video{width:100%;height:100%;object-fit:cover;display:block}
.bleed.scrim-l::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.55) 38%,rgba(0,0,0,0) 70%)}
.bleed.scrim-b::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.35) 40%,rgba(0,0,0,0) 65%)}
.bleed.scrim-r::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.5) 40%,rgba(0,0,0,0) 72%)}
figure.ph{margin:0;position:relative;background:#000;overflow:hidden}
figure.ph img{display:block;width:100%;height:100%;object-fit:cover}
figure.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;font-size:16px;color:#cfccc5;background:linear-gradient(0deg,rgba(0,0,0,.7),rgba(0,0,0,0))}
.tag{position:absolute;font-size:17px;color:#fff;letter-spacing:.04em;white-space:nowrap;pointer-events:none}
.tag::before{content:"";position:absolute;left:-22px;top:50%;width:14px;height:1px;background:#fff}

/* ---------- term (사전식 정의) ---------- */
.term{border-top:1px solid var(--line2);padding-top:22px}
.term .w{font-family:var(--head);font-size:84px;line-height:1;margin:0 0 6px}
.term .en{font-size:18px;letter-spacing:.16em;color:var(--mute);margin-bottom:24px;text-transform:uppercase}
.term p{font-size:30px;color:var(--ink)}

/* ---------- big number ---------- */
.big{font-family:var(--head);font-size:220px;line-height:.9;letter-spacing:-.02em}
.unitlbl{font-size:24px;color:var(--mute);letter-spacing:.06em}

/* ---------- table ---------- */
table.data{border-collapse:collapse;width:100%;font-size:26px}
table.data th{font-weight:400;font-size:17px;letter-spacing:.12em;color:var(--mute);text-align:left;padding:0 18px 14px;border-bottom:1px solid var(--line2)}
table.data td{padding:20px 18px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.data td.n,table.data th.n{text-align:right}
table.data tr.hl td{color:var(--acc)}

/* ---------- check (이것만은) ---------- */
ol.check{list-style:none;counter-reset:q;padding:0;margin:0}
ol.check li{counter-increment:q;position:relative;padding:26px 0 26px 76px;border-top:1px solid var(--line);font-size:30px;line-height:1.6}
ol.check li::before{content:counter(q,decimal-leading-zero);position:absolute;left:0;top:22px;font-family:var(--head);font-size:40px;color:var(--acc)}
.blank{display:inline-block;min-width:150px;border-bottom:2px solid var(--line2);text-align:center;color:transparent;cursor:pointer;padding:0 10px;transition:color .2s}
.blank.show{color:var(--acc);border-color:var(--acc)}
.choice{display:inline-block;padding:0 6px;cursor:pointer;border-bottom:2px solid transparent}
.choice.show{color:var(--acc);border-color:var(--acc)}

/* ---------- sim ---------- */
.sim{position:absolute;inset:0;background:#000;overflow:hidden}
.sim canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
.sim-host{position:relative;overflow:hidden;background:#000}
.hud{position:absolute;z-index:5;font-size:17px;color:var(--ink)}
.hud .lbl{font-size:14px;letter-spacing:.16em;color:var(--mute);margin-bottom:8px;text-transform:uppercase}
.seg{display:inline-flex;border:1px solid var(--line2)}
.seg button{border:0;border-right:1px solid var(--line2);background:rgba(0,0,0,.55);color:var(--ink);font:16px var(--body);padding:10px 18px;cursor:pointer;letter-spacing:.02em;min-height:44px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc);color:var(--acc-ink);font-weight:700}
.btn{border:1px solid var(--line2);background:rgba(0,0,0,.55);color:var(--ink);font:16px var(--body);padding:10px 18px;cursor:pointer;min-height:44px}
.btn.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
input[type=range].rng{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;cursor:pointer;margin:0}
input[type=range].rng::-webkit-slider-runnable-track{height:2px;background:var(--line2)}
input[type=range].rng::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-8px;background:var(--acc);border:0;border-radius:50%}
.readout{font-family:var(--head);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.readout small{font-family:var(--body);font-size:18px;color:var(--mute);margin-left:6px}
.panel{background:rgba(6,6,7,.78);border-left:2px solid var(--acc);padding:22px 26px}

/* ---------- overview ---------- */
#overview{position:absolute;inset:0;z-index:100;background:rgba(6,6,7,.97);display:none;padding:80px 88px;overflow:auto}
#overview.open{display:block}
#overview h4{font-family:var(--head);font-weight:normal;font-size:40px;margin:0 0 30px}
#overview ol{list-style:none;padding:0;margin:0;columns:3;column-gap:48px}
#overview li{break-inside:avoid;padding:12px 0;border-top:1px solid var(--line);font-size:20px;cursor:pointer;display:flex;gap:16px}
#overview li span{color:var(--dim);font-variant-numeric:tabular-nums;width:28px}
#overview li.cur{color:var(--acc)}

/* ---------- 3D 라벨 · 시뮬레이터 부품 ---------- */
.lbl3{position:absolute;left:0;top:0;font-size:17px;color:#fff;white-space:nowrap;transition:opacity .25s;letter-spacing:.02em;text-shadow:0 1px 3px #000,0 0 8px #000}
.lbl3.c{translate:-50% -50%}
.lbl3 span{color:var(--mute);margin-left:4px}
.lbl3.acc{color:var(--acc);font-weight:700}
.lbl3.blue{color:#b9c7ff}
.lbl3.tag-s{font-size:15px;margin:-26px 0 0 10px}
.lbl3.ghost{color:var(--mute)}
.lbl3.sunred{color:#ff5a4a;font-weight:700}   /* 4차시: 태양계 위치 = 빨강 */
.tele{position:absolute;right:40px;top:40px;width:430px;height:360px;border:1px solid var(--line2);z-index:4;pointer-events:none}
.tele .cap{height:40px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:15px;background:rgba(6,6,7,.9);border-bottom:1px solid var(--line2)}
.tele .cap b{font-weight:700;letter-spacing:.04em}
.tele .cap span{color:var(--mute)}
.ctl{right:40px;bottom:40px;width:430px;background:rgba(6,6,7,.78);padding:18px 20px;border:1px solid var(--line)}
.ctl .ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin:-6px 2px 14px;font-style:normal}
.ctl .ticks i{font-style:normal;width:16px;text-align:center;white-space:nowrap}
.ctl .seg{margin-right:8px}
.ctl .mon{color:var(--acc);font-weight:700}
.capbox{position:absolute;left:88px;bottom:72px;width:560px;z-index:4}
.capbox h2{font-size:58px;margin-bottom:18px}
.capbox p{font-size:25px;line-height:1.6;color:#e2dfd8;margin:0 0 10px}
.capbox .stp{position:absolute;left:0;bottom:0;width:100%}
.exag{position:absolute;left:88px;top:76px;z-index:4;font-size:14px;color:var(--dim);letter-spacing:.06em}
.minimap{position:absolute;right:40px;top:40px;width:320px;background:rgba(6,6,7,.86);border:1px solid var(--line2);z-index:4;opacity:0;transition:opacity .3s;pointer-events:none}
.minimap.on{opacity:1}
.minimap .cap{height:40px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:15px;border-bottom:1px solid var(--line2)}
.minimap .cap .ang{color:var(--acc);font-weight:700}
.minimap svg{display:block;width:100%;height:auto}
.minimap .ln{stroke:rgba(237,234,227,.55);stroke-width:1.2;stroke-dasharray:4 4}
.minimap .arc{fill:rgba(242,163,58,.45);stroke:var(--acc);stroke-width:1}
.minimap .tr{fill:#5f8a3c;stroke:#cfe3b3;stroke-width:1.5}
.minimap .pt{fill:#2a2a2a;stroke:#edeae3;stroke-width:1.5}
.minimap .me{fill:var(--acc);stroke:#fff;stroke-width:1.5}
.minimap .t{fill:#cfccc5;font-size:15px;font-family:var(--body)}
.ctl.street{width:380px}
.eyetags{position:absolute;inset:0;display:none;pointer-events:none;z-index:3}
.dual .eyetags{display:block}
.eyetags span{position:absolute;top:34px;font-size:17px;letter-spacing:.08em;padding:6px 14px;background:rgba(6,6,7,.72);border-left:2px solid var(--acc)}
.eyetags span:first-child{left:40px}.eyetags span:last-child{left:calc(50% + 40px)}
.eyevig{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse 75% 80% at 50% 50%,transparent 58%,rgba(0,0,0,.42) 100%)}
.dual .eyevig{background:radial-gradient(ellipse 38% 80% at 25% 50%,transparent 58%,rgba(0,0,0,.4) 100%),radial-gradient(ellipse 38% 80% at 75% 50%,transparent 58%,rgba(0,0,0,.4) 100%)}
.capbox.panel{background:rgba(6,6,7,.86);padding:30px 34px 26px;left:40px;bottom:40px;width:600px;border-top:2px solid var(--acc)}

/* ---------- 01 거리 덱 부품 ---------- */
.goals .col{border-top:1px solid var(--line2);padding-top:18px;font-size:30px;display:flex;gap:18px;align-items:baseline}
.goals .num{font-size:26px;color:var(--acc)}
svg.diag{width:100%;height:auto;max-height:680px}
svg.diag .bg{stroke:rgba(237,234,227,.5);stroke-width:2;stroke-dasharray:6 6}
svg.diag .sl{stroke:rgba(237,234,227,.75);stroke-width:1.5}
svg.diag .sl2{stroke:rgba(185,199,255,.6);stroke-width:1.5}
svg.diag .a1{fill:rgba(242,163,58,.55)}
svg.diag .a2{fill:rgba(185,199,255,.5)}
svg.diag .ob{fill:var(--acc)} svg.diag .ob2{fill:#b9c7ff}
svg.diag .pt{fill:var(--bg);stroke:var(--ink);stroke-width:2}
svg.diag .t{fill:var(--ink);font-size:20px;font-family:var(--body)}
svg.diag .t2{fill:var(--mute);font-size:20px;font-family:var(--body);letter-spacing:.1em}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:16px 0 16px 52px;border-top:1px solid var(--line);font-size:24px;line-height:1.55;color:#dcd9d2}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:14px;font-family:var(--head);font-size:30px;color:var(--acc)}
.unitrow{display:flex;align-items:baseline;gap:26px;margin-bottom:6px}
.unitrow .big{font-size:150px}
.unitrow .eq{font-size:60px;color:var(--mute)}
.unitcol{padding-right:60px;border-left:1px solid var(--line2);padding-left:40px}
.unitcol:first-child{border-left:0;padding-left:0}
.unitcol .big{font-size:180px}
.eqbar{position:absolute;left:88px;right:88px;bottom:96px;border-top:1px solid var(--line2);padding-top:28px;display:flex;gap:30px;align-items:baseline;font-size:64px;font-family:var(--head)}
.blink{position:relative;aspect-ratio:1/1;max-height:700px;background:#000;border:1px solid var(--line)}
.blink img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .12s}
.blink .b1{opacity:0}
.blink.s1 .b1{opacity:1}
.blink .bl-cap{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;font-size:17px;background:rgba(0,0,0,.65)}
.blink .w1,.blink.s1 .w0{display:none}
.blink.s1 .w1{display:inline}
.blink .ring{position:absolute;left:38.6%;top:36.6%;width:14%;height:14%;border:2px solid var(--acc);border-radius:50%}
table.clickable tr[data-star]{cursor:pointer}
table.data tr.hl td{color:var(--acc)}
.lbl3.star{margin:-12px 0 0 16px;font-size:16px;line-height:1.35}
.lbl3.star b{display:block;font-size:19px}
.lbl3.star em{font-style:normal;color:var(--mute)}
.lbl3.star.hl b{color:var(--acc)}
.lbl3.ring{color:var(--dim);font-size:14px}
.plates{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.plates figure{margin:0}
.plates canvas{display:block;width:100%;aspect-ratio:3/2;background:#000;border:1px solid var(--line)}
.plates figcaption{font-size:18px;color:var(--mute);margin-top:10px}
ol.check.qs{margin-top:22px}
ol.check.qs li{font-size:26px;padding:16px 0 16px 64px}
ol.check.qs li::before{font-size:30px;top:14px}
.sumcol{border-top:2px solid var(--acc);padding-top:22px}
.sumcol .num{font-size:28px;color:var(--acc);display:block;margin-bottom:10px}
.sumcol p{font-size:26px}
.sumcol .blank{min-width:110px}

/* ---------- 02 등급 덱 부품 ---------- */
.luxctl{width:400px;padding:14px 18px}
.luxctl .spreadb{width:100%}
.luxctl .vw{display:flex}.luxctl .vw button{flex:1;padding:10px 4px;min-height:48px}
.luxrec{right:40px;top:40px;width:470px;background:rgba(6,6,7,.8);border:1px solid var(--line);padding:12px 16px}
.luxrec .rhead{display:flex;justify-content:space-between;align-items:center}
.luxrec .rhead .lbl{margin:0}
.btn.mini{min-height:32px;padding:4px 12px;font-size:14px;margin-left:6px}
.luxrec table{margin-top:6px}
.luxrec .empty{font-size:15px;color:var(--mute);margin:8px 0 2px}
.luxrec.has .empty{display:none}
.luxrec:not(.has) table,.luxrec.folded table,.luxrec.folded .empty{display:none}
.luxrec .tabs button{min-height:40px;padding:6px 14px;font-size:15px}

.pg-polar.best b{background:linear-gradient(#ffd23f,#ff9f1a);color:#5a2a00}
.pg-count small{display:block;font-size:40px;-webkit-text-stroke:4px #2a2238;color:#fff;text-align:center;white-space:nowrap}
.pg-count b{display:block;text-align:center;font-weight:400}

.pg-menu,.pg-res{position:absolute;top:36px;width:660px;box-sizing:border-box;background:#fffdf5;border-radius:34px;padding:26px 36px 24px;box-shadow:0 10px 0 rgba(30,40,80,.25);pointer-events:auto;display:none}
.pg-menu{left:56px}.pg-res{right:56px;top:116px}
.photog[data-st=menu] .pg-menu,.photog[data-st=result] .pg-res{display:block;animation:pg-in .5s cubic-bezier(.3,1.5,.5,1)}
.pg-menu .kick,.pg-res .kick{margin:0;color:#ff5a6a;font-weight:700;font-size:18px;letter-spacing:.08em}
.pg-menu h3,.pg-res h3{font-family:var(--head);font-size:54px;margin:4px 0 6px;color:#2a2238;line-height:1.1;font-weight:400}
.pg-menu .lead{font-size:19px;line-height:1.5;margin:0 0 12px;color:#4b4360}.pg-menu .lead b{color:#e8452f}
.pg-menu .chars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pg-menu .chars button{background:#f3eefc;border-radius:18px;padding:8px 4px 6px;border:4px solid transparent!important;color:#2a2238;box-shadow:inset 0 -5px 0 var(--c)}
.pg-menu .chars button.on{border-color:var(--c)!important;background:#fff;transform:translateY(-3px)}
.pg-menu .chars b{display:block;font-family:var(--head);font-weight:400;font-size:24px}.pg-menu .chars small{font-size:13px;color:#8a8199}
.pg-menu .map{display:flex;align-items:center;margin:16px 0 10px}
.pg-menu .map>i{flex:1;height:0;border-top:5px dotted #d9cfe6;margin:0 -2px;transform:translateY(-12px)}
.pg-menu .map button{width:84px;background:none;padding:0;color:#2a2238}
.pg-menu .map button b{display:flex;align-items:center;justify-content:center;width:68px;height:68px;margin:0 auto;border-radius:50%;background:linear-gradient(#7cc4ff,#3fa6f0);color:#fff;font-family:var(--head);font-weight:400;font-size:34px;box-shadow:0 5px 0 #135596}
.pg-menu .map button.done b{background:linear-gradient(#8fe07a,#3fb24f);box-shadow:0 5px 0 #23782f}
.pg-menu .map button.lock b{background:#e6e0ee;box-shadow:0 5px 0 #c4bcd2;font-size:26px}
.pg-menu .map button.on b{outline:5px solid #ffd23f;outline-offset:3px;transform:scale(1.1)}
.pg-menu .map button span{display:block;margin-top:8px;font-size:17px;letter-spacing:1px}
.pg-menu .map button.shake b{animation:pg-shake .4s}
@keyframes pg-shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pg-menu .map span i,.pg-res .stars i{font-style:normal;color:#ddd5e6}.pg-menu .map span i.on{color:#ffc61a}
.pg-menu .info{background:#f6f1fb;border-radius:20px;padding:12px 18px}
.pg-menu .info b{font-family:var(--head);font-weight:400;font-size:28px}
.pg-menu .info p{margin:4px 0 0;font-size:17px;line-height:1.45;color:#4b4360}.pg-menu .info .g{font-weight:700;color:#2a2238}.pg-menu .info .bst{color:#8a8199;font-size:15px}
.pg-menu .go,.pg-res .row button{display:block;width:100%;margin-top:14px;border-radius:999px;padding:13px;font-family:var(--head);font-size:32px;color:#fff;
  background:linear-gradient(#ff7a6a,#ff4d5e);box-shadow:0 7px 0 #b3263a}
.pg-menu .go:active,.pg-res .row button:active{transform:translateY(5px);box-shadow:0 2px 0 #b3263a}
.pg-menu .foot{margin:14px 0 0;text-align:center;font-size:19px;color:#4b4360}.pg-menu .foot b{color:#e8452f}
.pg-menu .keys{margin:6px 0 0;text-align:center;font-size:14px;color:#8a8199}
.pg-res h3 .n{color:#ff5a6a;font-size:80px}
.pg-res h3 em{font-style:normal;font-family:var(--body);font-weight:700;font-size:18px;background:#ffd23f;color:#5a2a00;border-radius:999px;padding:4px 12px;margin-left:12px;vertical-align:middle}
.pg-res .stars{font-size:58px;letter-spacing:8px;line-height:1}.pg-res .stars.none{display:none}
.pg-res .stars i.on{color:#ffc61a;text-shadow:0 3px 0 #d98e00}
.pg-res .stars.show i{display:inline-block;animation:pg-star .5s cubic-bezier(.3,1.8,.5,1) backwards}
.pg-res .stars.show i:nth-child(2){animation-delay:.35s}.pg-res .stars.show i:nth-child(3){animation-delay:.7s}
@keyframes pg-star{from{transform:scale(0) rotate(-90deg)}}
.pg-res .bd{list-style:none;margin:10px 0 0;padding:0}
.pg-res .bd li{display:flex;justify-content:space-between;font-size:19px;padding:4px 0;border-bottom:1px dashed #e3dcea;color:#4b4360}
.pg-res .bd li b{font-family:var(--head);font-weight:400;font-size:22px;color:#2a2238}.pg-res .bd li.tip{display:block;color:#e8452f;border:0}
.pg-res .best{margin:8px 0 10px;color:#c46a00;font-weight:700;font-size:18px}.pg-res .best:empty{display:none}
.pg-res .album{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pg-res figure{margin:0;background:#fff;padding:6px 6px 4px;box-shadow:0 3px 8px rgba(0,0,0,.18);transform:rotate(-2deg)}
.pg-res figure:nth-child(2n){transform:rotate(2deg)}
.pg-res figure div{height:88px;background:#ddd center/cover}
.pg-res figcaption{font-size:12px;text-align:center;margin-top:3px;white-space:nowrap;overflow:hidden;color:#4b4360}
.pg-res .find{margin-top:12px;background:#fff4d6;border-radius:18px;padding:10px 18px}
.pg-res .find b{font-size:18px;color:#c46a00}.pg-res .find p{margin:4px 0 0;font-size:17px;line-height:1.5;color:#2a2238}.pg-res .find p b{font-size:inherit;color:#e8452f}
.pg-res .row{display:flex;gap:10px}.pg-res .row button{font-size:24px;padding:12px 8px}
.pg-res .row .again{background:linear-gradient(#ffc04d,#ff9f1a);box-shadow:0 7px 0 #b86a00}
.pg-res .row .menu{background:linear-gradient(#7cc4ff,#3fa6f0);box-shadow:0 7px 0 #135596}
.photog .eyetags span{top:112px}   /* 위쪽 가운데 넘기기 막대와 겹치지 않게 */

/* 2차시 「똑같이 보이게!」 — 밤 섬 · 망원경 화면 · 밝기 측정기 */
.sim.lumg{background:#050916}
.lumg .pg-order .big u{text-decoration:none;color:#e8452f}
.lumg .lg-tag{font-family:var(--body);font-size:19px;font-weight:700;color:#2a2238;background:#fffdf5;border-radius:999px;padding:5px 14px;text-shadow:none;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.lumg .lg-tag b{font-family:var(--head);font-weight:400;font-size:21px;color:#e8452f;margin-left:2px}
.lumg .lg-tag i{font-style:normal;display:inline-block;width:26px;height:26px;line-height:26px;margin-right:6px;border-radius:50%;background:#ffd23f;color:#5a2a00;text-align:center;font-family:var(--head);font-size:18px}
.lumg .lg-tag.sel{background:#ffd23f;transform:scale(1.12)}
.lg-tele{position:absolute;right:28px;top:150px;width:520px;height:300px;box-sizing:border-box;border:6px solid #fffdf5;border-radius:22px;box-shadow:0 7px 0 rgba(0,0,0,.4);overflow:hidden}
.lg-tele i{position:absolute;inset:0;background:radial-gradient(ellipse 75% 85% at 50% 50%,transparent 75%,rgba(0,0,0,.85) 100%)}
.lg-tele i::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:26px;translate:-50% -50%;border:2px solid rgba(255,255,255,.18);border-radius:50%}
.lg-tele span{position:absolute;left:12px;top:10px;z-index:1;background:#2a2238;color:#fff;border-radius:999px;padding:4px 14px;font-size:16px;font-weight:700}
.lg-bars{position:absolute;right:28px;top:468px;width:520px;box-sizing:border-box;background:#fffdf5;border-radius:22px;padding:12px 18px 14px;box-shadow:0 7px 0 rgba(0,0,0,.4);transition:background .25s}
.lg-bars p{margin:0 0 6px;font-weight:700;font-size:17px;color:#5d5470;display:flex;justify-content:space-between}
.lg-bars p em{font-style:normal;color:#fff;background:#2fb35a;border-radius:999px;padding:0 12px;opacity:0;transition:opacity .2s}
.lg-bars.ok{background:#e6f9e3}.lg-bars.ok p em{opacity:1}
.lg-bars .r{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:10px;margin-top:6px}
.lg-bars .r b{font-family:var(--head);font-weight:400;font-size:21px;color:#2a2238;white-space:nowrap}
.lg-bars .r span{height:22px;border-radius:999px;background:#ece6f3;overflow:hidden;box-shadow:inset 0 0 0 3px var(--c)}
.lg-bars .r i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb02e,#ffe27a);border-radius:999px}
.lg-bars.ok .r i{background:linear-gradient(90deg,#3fb24f,#9be27a)}
.lumg .pg-res{top:56px}

/* 마무리 게임 「스타-윙또」 — 레이싱 게임 화면 (카트라이더 공식 사이트 색 · 레이싱 UI 를 바탕으로 한 inspired-by 디자인. 넥슨 로고 · 캐릭터 · 그림은 쓰지 않음)
   색: 레이싱 노랑 #FDD801 (행동 · 강조 · 1등) + 로열 블루 #13027C (패널) + 바탕 #0D0D0D / 가속 = 부스터 주황 #FF5A1F / 위험 #E8243C
   모양: 모서리를 비스듬히 자른 판(clip-path) · 기울인 굵은 숫자(italic) · 체크무늬 결승선 띠 · 아래 테두리가 두꺼운 눌리는 버튼
   그라디언트 · 빛 번짐 · 글자 외곽선은 쓰지 않는다 (그림은 우주 사진 · 지형 · 캐릭터가 맡는다)
   글꼴: GameT(검은고딕) = 숫자 · 제목 (기울임) / GameU(주아) = 나머지 */
.sim.race{--pri:#FDD801;--pri-p:#E8C400;--pri-e:#B89A00;--on-pri:#0D0D0D;--link:#8FB8FF;--com:#FF5A1F;--gold:#FDD801;--warn:#E8243C;--ok:#1FA55A;
  --blue:#13027C;--deep:#0B0450;--elev:#170A8C;--char:#22149E;--glass:rgba(19,2,124,.84);--glass2:rgba(19,2,124,.62);--hair:rgba(255,255,255,.16);
  --cut:14px;--chk:repeating-conic-gradient(#fff 0 25%,#0d0d0d 0 50%) 0 0/14px 14px;
  --body2:rgba(255,255,255,.72);--mute:rgba(229,229,229,.55);--sh:0 8px 24px rgba(0,0,0,.35);
  --gt:"GameT",var(--head);--gu:"GameU",var(--body);
  background:#0D0D0D;touch-action:none;user-select:none;-webkit-user-select:none}
.race .rc-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.race .rc-ui{position:absolute;inset:0;pointer-events:none;z-index:4;font-family:var(--gu);color:#fff}
.race .rc-ui b,.race .rc-ui p,.race .rc-ui li,.race .rc-ui h1,.race .rc-ui h2,.race .rc-ui h3,.race .rc-ui small,.race .rc-ui span,.race .rc-ui em{color:inherit;font-weight:400}
.race .rc-ui button,.race .rc-ui input,.race .rc-ui a,.race .rc-join,.race .rc-wait,.race .rc-over,.race .rc-lobby,.race .rc-card{pointer-events:auto}
.race .rc-ui button{font-family:var(--gu);cursor:pointer;touch-action:manipulation;border:0;color:inherit}
.race .rc-ui button:focus-visible,.race .rc-ui input:focus-visible{outline:3px solid var(--link);outline-offset:3px}
.race .rc-k{font-family:var(--gt);font-size:28px;color:#fff;margin:0 0 12px}
.race .rc-note{font-size:17px;color:var(--mute);margin:12px 0 0}
/* 숫자 · 큰 글자가 사진 위에 떠 있을 때만 그림자 (외곽선 대신) */
.race .rc-ui{--ts:0 2px 10px rgba(0,0,0,.55)}

/* 게임 제목: 흰 글자 + 금색 낱말 하나 */
.race .rc-logo{font-family:var(--gt);font-size:84px;line-height:1;margin:0;display:flex;gap:.06em;letter-spacing:-.01em;text-shadow:var(--ts)}
.race .rc-logo span{color:#fff}
.race .rc-logo span+span{color:var(--gold)}

/* 버튼: 알약 · 한 가지 파랑 */
.race .rc-btn{display:block;margin:24px auto 0;background:var(--pri);color:#fff;font-family:var(--gt);font-size:28px;border-radius:999px;padding:14px 44px;transition:background .15s,transform .1s}

.race .rc-btn:active{transform:scale(.97)}
.race .rc-btn.big{font-size:34px;padding:16px 60px}
.race .rc-btn small{font-family:var(--gu);font-size:.6em;margin-left:10px;opacity:.8}
.race .rc-btn:disabled{background:var(--char);color:var(--mute);cursor:default;transform:none}
.race .rc-btn.ghost{background:none;color:var(--body2);font-family:var(--gu);font-size:19px;text-decoration:underline;text-underline-offset:4px;padding:8px 12px}


/* 참가 화면 */
.race .rc-join{position:absolute;inset:0;padding:32px 60px 0;display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,rgba(5,6,16,.25),rgba(5,6,16,.7))}
.race .rc-row{display:flex;gap:16px}
.race .rc-row label{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:18px;color:var(--body2)}
.race .rc-row input{font:30px var(--gu);padding:12px 18px;border-radius:8px;border:1px solid var(--hair);width:300px;background:#fff;color:#000}
.race .rc-row .tk input{width:220px;font-family:var(--gt);font-size:44px;letter-spacing:.2em;text-align:center;padding:8px 10px}
.race .rc-row input::placeholder{color:rgba(0,0,0,.25)}
.race .rc-teams-pick{display:flex;gap:12px;margin:24px 0 8px}
.race .rc-teams-pick button{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--hair);color:#fff;font-family:var(--gt);font-size:26px;border-radius:999px;padding:10px 24px 10px 16px;transition:background .15s,transform .1s}
.race .rc-teams-pick button i{width:14px;height:14px;border-radius:50%;background:var(--c)}

.race .rc-teams-pick button.on{background:var(--c);border-color:var(--c);color:#000}
.race .rc-teams-pick button.on i{background:#fff}
.race .rc-teams-pick.big button{font-size:32px;padding:14px 32px 14px 22px}
.race .rc-teams-pick.big button i{width:18px;height:18px}
.race .rc-err{font-size:20px;color:#ff8a9a;min-height:28px;margin:12px 0 0}
.race .rc-tag{font-size:21px;color:var(--body2);margin:16px 0 4px}
.race .rc-join.step1{justify-content:center;gap:8px}
.race .rc-join.step1 .rc-logo{font-size:120px;margin-bottom:8px}
.race .rc-join.step1 .rc-row{margin-top:16px}
.race .rc-join.step2{justify-content:center}
.race .rc-th{display:flex;align-items:center;gap:14px;font-family:var(--gt);font-size:56px;margin:4px 0 0;color:#fff;text-shadow:var(--ts)}
.race .rc-th i{width:22px;height:22px;border-radius:50%;background:var(--c)}
.race .rc-th small{font-family:var(--gu);font-size:21px;color:var(--body2);margin-left:8px;text-shadow:none}
.race .rc-names{list-style:none;margin:24px 0 8px;padding:0;display:grid;grid-template-columns:repeat(2,360px);gap:12px 24px}
.race .rc-names li{display:flex;align-items:center;gap:12px}
.race .rc-names b{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--gt);font-size:26px;background:var(--c);color:#000}
.race .rc-names input{flex:1;font:28px var(--gu);padding:10px 16px;border-radius:8px;border:1px solid var(--hair);background:#fff;color:#000}

/* 캐릭터 카드 */
.race .rc-heroes{display:flex;gap:16px}
.race .rc-heroes button{position:relative;width:228px;padding:0 0 16px;border-radius:16px;border:1px solid var(--hair);background:var(--elev);display:flex;flex-direction:column;align-items:stretch;text-align:left;overflow:hidden;transition:transform .15s,border-color .15s}

.race .rc-heroes .pic{display:block;height:160px;background:color-mix(in srgb,var(--c) 52%,var(--char))}
.race .rc-heroes .pic img{width:160px;height:160px;display:block;margin:0 auto}
.race .rc-heroes b{font-family:var(--gt);font-size:30px;line-height:1;margin:14px 16px 0}
.race .rc-heroes small{font-size:16px;color:var(--mute);margin:6px 16px 10px}
.race .rc-heroes dl{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin:0 16px 12px;font-size:14px;align-items:center}
.race .rc-heroes dt{color:var(--mute)}.race .rc-heroes dd{margin:0}
.race .rc-heroes dd i{display:flex;gap:3px}
.race .rc-heroes dd u,.race .rc-heroes dd s{flex:1;height:6px;border-radius:999px;text-decoration:none}
.race .rc-heroes dd u{background:#fff}
.race .rc-heroes dd s{background:rgba(255,255,255,.12)}
.race .rc-heroes em{font-style:normal;font-size:16px;margin:0 16px;padding-top:12px;border-top:1px solid var(--hair);display:flex;align-items:center;gap:8px;color:var(--body2)}
.race .rc-heroes em span{font-family:var(--gt);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--pri);color:#fff;font-size:15px}
.race .rc-heroes button.on{border-color:#fff;box-shadow:0 0 0 2px #fff;transform:translateY(-6px)}
.race .rc-heroes button.on::after{content:"선택";position:absolute;top:12px;right:12px;background:#fff;color:#000;font-family:var(--gt);font-size:15px;padding:4px 12px;border-radius:999px}

/* 대기실 (주자마다 캐릭터) */
.race .rc-wait2{justify-content:flex-start;padding-top:28px}
.race .rc-roster{list-style:none;display:flex;gap:8px;margin:16px 0 4px;padding:0}
.race .rc-roster li{display:flex;align-items:center;gap:8px;font-size:21px;background:var(--glass);border:1px solid var(--hair);border-radius:999px;padding:4px 18px 4px 4px;cursor:pointer;transition:background .15s}
.race .rc-roster li b{width:26px;text-align:center;font-family:var(--gt);color:var(--mute)}
.race .rc-roster .pic{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--char)}
.race .rc-roster .pic img{width:44px;height:44px;margin:-2px}
.race .rc-roster li.now{background:#fff;color:#000}
.race .rc-roster li.now b{color:#000}
.race .rc-pickq{font-size:22px;margin:12px 0 16px;color:var(--body2)}
.race .rc-pickq b{font-family:var(--gt);color:#fff;margin-right:6px}
.race .rc-pickq small{font-size:16px;color:var(--mute);margin-left:8px}
.race .rc-wait2 .rc-heroes .pic{height:140px}
.race .rc-wait2 .rc-heroes .pic img{width:140px;height:140px}
.race .rc-how{margin-top:20px;background:var(--glass);border:1px solid var(--hair);border-radius:16px;padding:14px 22px}

/* 조작 안내 (키 그림) */
.race .rc-keys{display:flex;flex-direction:column;gap:8px;text-align:left;font-size:17px;line-height:1.5;color:var(--body2)}
.race .rc-keys span{display:flex;align-items:center;flex-wrap:wrap;gap:2px}
.race .rc-keys em{font-style:normal;color:#fff;margin-left:12px}
.race .rc-keys kbd{display:inline-block;min-width:28px;padding:0 8px;margin:0 2px;border-radius:6px;background:rgba(255,255,255,.1);border:1px solid var(--hair);font:15px var(--gu);color:#fff;text-align:center;line-height:24px}

/* ===== 경기 화면 ===== */
.race .rc-hud{position:absolute;inset:0}
/* 왼쪽 위: 내 얼굴 · 주자 · 거리 · HP */
.race .rc-me{position:absolute;left:24px;top:20px;display:flex;align-items:center;gap:14px;background:var(--glass);border:1px solid var(--hair);border-radius:999px;padding:6px 24px 6px 6px;box-shadow:var(--sh)}
.race .rc-me .pic{width:72px;height:72px;border-radius:50%;background:color-mix(in srgb,var(--c) 35%,var(--char));box-shadow:0 0 0 3px var(--c);overflow:hidden}
.race .rc-me .pic img{width:76px;height:76px;margin:-2px}
.race .rc-me .rn{display:block;font-size:16px!important;color:var(--body2)!important;white-space:nowrap}
.race .rc-me em{font-style:normal;font-family:var(--gt);font-size:38px;line-height:1.05}
.race .rc-me em small{font-size:20px;margin-left:3px;color:var(--body2)}
.race .rc-hp{position:relative;width:240px;height:18px;margin-top:6px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;--hp:100%}

.race .rc-foot{display:flex;align-items:center;gap:22px;margin-top:22px}.race .rc-foot .rc-btn{margin:0}.race .rc-room{font-family:var(--gt);font-size:20px;color:var(--mute)}
.race .rc-over>.rc-note{font-size:19px;margin-top:18px}

/* 강의자료 속 링크 슬라이드 (게임은 따로 연다) */
.sim.race:has(.rc-links){background:#0b0c12}
.race .rc-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:640px;padding:40px 56px;border-radius:16px;border:1px solid var(--hair);background:var(--elev);box-shadow:var(--sh);text-align:center}
.race .rc-card h1{font-family:var(--gt);font-size:88px;margin:0 0 12px;color:#fff}
.race .rc-card h2{font-family:var(--gt);font-size:40px;margin:0 0 12px}
.race .rc-card p{font-size:21px;margin:6px 0;color:var(--body2)}
.race .rc-card .rc-k{font-family:var(--gu);font-size:18px;color:var(--mute)}
.race .rc-links a.rc-btn{text-decoration:none;width:max-content;pointer-events:auto}
.race .rc-links .rc-note{font-size:17px;margin-top:10px}
.race .rc-links a.rc-btn.ghost{text-decoration:underline}
.race .rc-links{width:1180px}.race .rc-links .rc-logo{justify-content:center;font-size:96px;margin:4px 0 18px}
.race .rc-rules{list-style:none;margin:0 0 22px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;text-align:left}
.race .rc-rules li{font-size:18px;line-height:1.5;color:var(--body2);background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:12px;padding:12px 16px}
.race .rc-rules li:first-child{grid-column:1/-1}
.race .rc-rules b{display:block;font-family:var(--gt);font-weight:400;font-size:22px;color:var(--gold);margin-bottom:2px}

/* ===== 레이싱 스킨: 비스듬히 자른 판 · 기울인 숫자 · 체크무늬 · 노랑 버튼 ===== */
/* 비스듬히 자른 판: 왼쪽 위 · 오른쪽 아래 모서리를 잘라 레이싱 HUD 처럼 */
.race .rc-join-info,.race .rc-tgrid .tc,.race .rc-res,.race .rc-card,.race .rc-side,.race .rc-how,.race .rc-heroes button,.race .rc-item .tx,.race .rc-waitbar,.race .rc-msg .rc-keys{
  border-radius:0;clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
/* 평행사변형 띠: 이름표 · 시간 · 순위 줄 · 칩 */
.race .rc-me,.race .rc-time,.race .rc-tlist li,.race .rc-bt .bgn,.race .chip:not(.th .chip),.race .rc-teams-pick button,.race .rc-roster li,.race .rc-live,.race .rc-rivals span,.race .rc-msg .cdinfo,.race .rc-fx span,.race .rc-legs li,.race .rc-rest li,.race .rc-pips{
  border-radius:0;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.race .rc-me{padding-left:14px;padding-right:34px}
.race .rc-me .pic{border-radius:8px;box-shadow:inset 0 0 0 3px var(--c)}
.race .rc-time,.race .rc-tlist li{padding-left:18px;padding-right:18px}
/* 노랑 버튼: 검정 기울임 글자 · 아래 두꺼운 테두리 → 누르면 내려앉는다 */
.race .rc-btn{background:var(--pri);color:var(--on-pri);font-style:italic;border-radius:0;clip-path:polygon(16px 0,100% 0,calc(100% - 16px) 100%,0 100%);padding-left:56px;padding-right:56px;box-shadow:inset 0 -6px 0 var(--pri-e);transition:transform .1s cubic-bezier(.23,1,.32,1),box-shadow .1s}
.race .rc-btn:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 var(--pri-e)}
.race .rc-btn:disabled{background:var(--char);color:var(--mute);box-shadow:none}
.race .rc-btn.ghost{clip-path:none;box-shadow:none;font-style:normal;padding:8px 12px}
.race .rc-heroes em span,.race .rc-q .lv{background:var(--pri);color:var(--on-pri)}
.race .rc-q .lv{border-radius:0;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);padding:2px 14px}
.race .rc-q .lv.orb{background:rgba(255,255,255,.2);color:#fff}
/* 기울인 굵은 숫자 */
.race .rc-logo,.race .rc-rank,.race .rc-time,.race .rc-me em,.race .rc-speed b,.race .rc-msg .cd,.race .rc-code>b,.race .rc-pod .blk i,.race .rc-pod .st em,.race .rc-side li em,.race .rc-tlist li em,.race .rc-th,.race .rc-k{font-style:italic}
/* 제목: 흰 글자 + 노랑 + 아래 체크무늬 결승선 */
.race .rc-logo{position:relative;padding-bottom:.22em}
.race .rc-logo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.14em;background:var(--chk);clip-path:polygon(.2em 0,100% 0,calc(100% - .2em) 100%,0 100%)}
.race .rc-logo span+span{color:var(--pri)}
/* 판 위쪽 노랑 줄 */
.race .rc-join-info,.race .rc-res,.race .rc-card,.race .rc-side,.race .rc-q{box-shadow:inset 0 4px 0 var(--pri)}
.race .rc-tgrid .tc::before{height:6px}
/* 참가 · 대기 바탕: 짙은 파랑으로 가라앉힌 우주 */
.race .rc-join{background:linear-gradient(180deg,rgba(19,2,124,.3),rgba(8,3,48,.82))}
/* 방 번호: 노랑 판 · 파랑 숫자 */
.race .rc-code{background:var(--pri);color:var(--blue);border-radius:0;clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.race .rc-code p{color:rgba(19,2,124,.7)}.race .rc-code p b{color:var(--blue)}
.race .rc-row .tk input,.race .rc-names input{border-radius:0;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.race .chip.on,.race .rc-roster li.now,.race .rc-teams-pick button.on{background:var(--pri);color:var(--on-pri)}
.race .rc-roster li.now b{color:var(--on-pri)}
.race .rc-teams-pick button.on{border-color:var(--pri)}
.race .rc-teams-pick button.on i{background:var(--c)}
/* 캐릭터 카드: 고르면 노랑 테두리 + 노랑 '선택' 꼬리표 */
.race .rc-heroes button{border:0;background:var(--elev)}
.race .rc-heroes button.on{box-shadow:inset 0 0 0 4px var(--pri)}
.race .rc-heroes button.on::after{background:var(--pri);color:var(--on-pri);border-radius:0;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);font-style:italic;padding:4px 16px}
.race .rc-heroes dd u{background:var(--pri)}
/* 경기 HUD */
.race .rc-rank b{font-size:112px}
.race .rc-rank b,.race .rc-rank span{color:#fff;text-shadow:5px 6px 0 var(--blue)}
.race .rc-rank[data-top="1"] b,.race .rc-rank[data-top="1"] span{color:var(--pri)}
.race .rc-tlist li.me{box-shadow:inset 0 0 0 2px var(--pri)}
.race .rc-pips li.now{background:var(--pri)}
.race .rc-item .ic{background:radial-gradient(circle,var(--deep) 60%,transparent 61%),conic-gradient(var(--pri) calc(var(--p) * 360deg),rgba(255,255,255,.14) 0)}
.race .rc-item.on .ic{color:var(--on-pri);background:radial-gradient(circle,var(--pri) 60%,transparent 61%),conic-gradient(#fff 360deg,#fff 0)}
.race .rc-speed .dial{background:conic-gradient(from 225deg,var(--pri) calc(var(--p) * 270deg),rgba(255,255,255,.14) calc(var(--p) * 270deg) 270deg,transparent 270deg)}
.race .rc-speed.on .dial{background:conic-gradient(from 225deg,var(--com) calc(var(--p) * 270deg),rgba(255,255,255,.14) calc(var(--p) * 270deg) 270deg,transparent 270deg)}
.race .rc-b{box-shadow:inset 0 -7px 0 rgba(0,0,0,.28),var(--sh);font-style:italic}
.race .rc-b.skill.on{background:var(--pri);border-color:var(--pri)!important;color:var(--on-pri)!important}
.race .rc-b.skill.on i{color:var(--on-pri)}
.race .rc-q span u{background:var(--pri);color:var(--on-pri);border-radius:0;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%);padding:2px 12px}
.race .rc-q .qt{color:var(--on-pri);font-style:italic}
/* 카운트다운: 노랑 기울인 숫자 + 파랑 그림자 (외곽선 대신 단색으로 밀어 낸 그림자) */
.race .rc-msg .cd{color:var(--pri);text-shadow:8px 10px 0 var(--blue)}
.race .rc-msg .cd.go{color:#fff;text-shadow:8px 10px 0 var(--com)}
/* 결과: 체크무늬 띠 + 금 · 은 · 동 시상대 (팀 색은 시상대 위 이름표로) */
.race .rc-res{position:relative;padding-top:40px;background:rgba(11,4,80,.94)}
.race .rc-over{background:rgba(5,3,30,.7)}
.race .rc-res::before{content:"";position:absolute;left:0;right:0;top:4px;height:14px;background:var(--chk)}
.race .rc-pod .s1 .blk{background:#FDD801}.race .rc-pod .s2 .blk{background:#C9D3E0}.race .rc-pod .s3 .blk{background:#D98A4A}
.race .rc-pod .blk{border-radius:0;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 100%,0 100%)}
.race .rc-pod .blk i{color:var(--blue)}
.race .rc-pod .st b{display:inline-flex;align-items:center;gap:8px}
.race .rc-pod .st b::before{content:"";width:14px;height:14px;background:var(--c);clip-path:polygon(3px 0,100% 0,calc(100% - 3px) 100%,0 100%)}
.race .rc-pod .crown{display:inline-flex;align-items:center;gap:6px;background:var(--pri);color:var(--on-pri);border-radius:0;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);font-style:italic;padding:4px 20px}
.race .rc-pod .crown svg{width:22px;height:22px}
.race .rc-mvp li{border-radius:0;border-top-color:var(--pri);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
/* 링크 슬라이드 */
.race .rc-rules li{border-radius:0;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.race .rc-rules b{color:var(--pri)}

/* 마우스가 있는 기기에서만 hover (디벗에서 누른 뒤 떠 있는 채로 남지 않게) */
@media (hover:hover) and (pointer:fine){
  .race .rc-btn:hover{background:var(--pri-p)}
  .race .rc-btn.ghost:hover{color:#fff;background:none}
  .race .rc-teams-pick button:not(.on):hover{background:var(--char)}
  .race .rc-heroes button:hover{transform:translateY(-4px)}
  .race .chip:not(.on):hover{background:rgba(255,255,255,.16)}
}
/* 움직임 줄이기: 위치 · 크기 움직임은 빼고, 나타남 · 사라짐(투명도)만 남긴다 */
@keyframes rc-fade{0%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .race .rc-ui *{transition-property:opacity,background-color,border-color,color!important}
  .race .rc-msg .cd,.race .rc-pod .blk,.race .rc-pod .crown{animation-name:rc-fade!important}
  .race .rc-item.got .ic{animation:none}
  .race .rc-heroes button.on,.race .rc-heroes button:hover,.race .rc-btn:active{transform:none}
  .race .rc-q{transform:translate(-50%,0);opacity:0;transition:opacity .2s}
  .race .rc-q.on{opacity:1}
}
/* 대기실: 연결 표시 */
.race .rc-live{display:inline-flex;align-items:center;gap:8px;margin:10px 0 0;font-size:18px;background:var(--glass);border:1px solid var(--hair);border-radius:999px;padding:6px 16px}
.race .rc-live i{width:10px;height:10px;border-radius:50%;background:#3ddc84}

/* 스타-윙또 선생님 화면: 팀 레인 ↔ 경기 화면(관전) */
.race .rc-view{display:flex;border:1px solid var(--hair);border-radius:999px;overflow:hidden;background:var(--glass)}
.race .rc-view button{font-size:19px;padding:7px 16px;background:transparent;color:var(--mute)}
.race .rc-board[data-view=lanes] .rc-view [data-v=lanes],.race .rc-board[data-view=watch] .rc-view [data-v=watch]{background:#FDD801;color:#13027C;font-weight:700}
.race .rc-board[data-view=lanes] .rc-wq{display:none}
.race .rc-board[data-view=watch] .rc-side li[data-t]{cursor:pointer}
.race .rc-side li.auto{font-size:17px;color:var(--mute);justify-content:center;border:1px dashed var(--hair);border-radius:10px;margin:4px 0}
.race .rc-side li.fol{box-shadow:inset 4px 0 0 #FDD801;background:rgba(253,216,1,.12)}
.race .rc-wq{position:absolute;left:24px;top:104px;max-width:760px;pointer-events:none}
.race .rc-wq .who{display:inline-flex;align-items:center;gap:10px;margin:0;font:400 28px var(--gt);color:#fff;background:var(--glass);border:1px solid var(--hair);border-radius:999px;padding:6px 18px}
.race .rc-wq .who i{width:16px;height:16px;border-radius:50%;background:var(--c)}.race .rc-wq .who em{font-style:normal;color:#FDD801}.race .rc-wq .who small{font-size:15px;color:var(--mute)}
.race .rc-wq .q{margin-top:10px;background:rgba(255,253,245,.96);color:#1a1530;border-radius:16px;padding:12px 18px}
.race .rc-wq .q p{margin:0 0 8px;font:400 26px var(--gu)}.race .rc-wq .q div{display:flex;flex-wrap:wrap;gap:8px}
.race .rc-wq .q span{display:inline-flex;align-items:center;gap:6px;background:#efeaf8;border-radius:999px;padding:4px 12px;font-size:19px}
.race .rc-wq .q u{text-decoration:none;color:#6a3fd6;font-weight:700}
.race .rc-board[data-view=watch] .rc-side{pointer-events:auto}

/* ===== 4차시 「우주선 탈출」 (sims/shipesc.js) — 게임 덱 · 4차시 강의자료 마지막 장이 함께 쓴다 ===== */
/* 아이탈출식: 장면 한 장 + 아래 검은 가방 띠. 누른 곳으로 아이가 걸어가고, 글자 대신 그림 기호 말풍선 */
.sim.se{background:#000;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;color:#161320}
.se button{font-family:inherit;cursor:pointer;touch-action:manipulation;border:0;padding:0;background:none;color:inherit}
.se-scene{position:absolute;left:0;top:0;width:1600px;height:780px;overflow:hidden;background:#161b2d}
.se-scene.shake{animation:se-shk .5s}
@keyframes se-shk{20%{transform:translate(-10px,4px)}40%{transform:translate(9px,-5px)}60%{transform:translate(-6px,3px)}80%{transform:translate(4px,0)}}
.se-room{position:absolute;inset:0;display:none}.se-room.on{display:block}
.se-bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.se-fg,.se-act,.se-close svg,.se-cover svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.se-act{pointer-events:none;z-index:2}
.se [data-h]{cursor:pointer}
.se-fg *{transform-box:fill-box}
.se-wipe{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:8;transition:opacity .4s}.se-wipe.on{opacity:1}

/* 아이: 위치는 JS 가 transform 으로, 걷기 · 몸짓은 안쪽 층 */
.se #kid,.se .kflip,.se .kpose,.se .kbody{transform-box:view-box;transform-origin:0 0}
.se .kflip{transition:transform .12s}
.se #kid.gone{opacity:0;transition:opacity .3s}
.se .kbody{animation:se-breath 2.6s ease-in-out infinite}
@keyframes se-breath{50%{transform:scale(1.015,.985)}}
.se .kid.walk .kbody{animation:se-walk .34s ease-in-out infinite}
@keyframes se-walk{0%,100%{transform:none}25%{transform:translateY(-14px) rotate(-3deg)}75%{transform:translateY(-14px) rotate(3deg)}}
.se .kid.wake .kbody{animation:se-wake .9s ease}
@keyframes se-wake{0%{transform:rotate(-80deg) translateY(30px)}60%{transform:rotate(8deg)}100%{transform:none}}
.se .kpose.no{animation:se-no .5s ease}@keyframes se-no{20%,60%{transform:rotate(-5deg)}40%,80%{transform:rotate(5deg)}}
.se .kpose.reach{animation:se-reach .4s ease}@keyframes se-reach{50%{transform:translateY(-18px) scale(1.04,.96)}}
.se .kpose.jump{animation:se-jump .5s cubic-bezier(.3,1.6,.5,1)}@keyframes se-jump{40%{transform:translateY(-60px) scale(.95,1.06)}}
.se .kpose.tumble{animation:se-tumble .9s ease}
@keyframes se-tumble{0%{transform:none}30%{transform:translateY(-90px) rotate(-40deg)}65%{transform:translateY(-20px) rotate(-320deg)}100%{transform:rotate(-360deg)}}
.se .kid .ks{display:none}.se .kid .ks0{display:inline}
.se .kid.surprise .ks0,.se .kid.happy .ks0,.se .kid.goo .ks0,.se .kid.sad .ks0{display:none}
.se .kid.surprise .ks1,.se .kid.sad .ks1,.se .kid.happy .ks2,.se .kid.goo .ks3{display:inline}

/* 주울 물건 */
.se .item{transform-origin:50% 100%}
.se .item.hide{display:none}
.se .item.pop{animation:se-popout .8s cubic-bezier(.3,0,.5,1)}
@keyframes se-popout{0%{transform:translate(var(--fx),var(--fy)) scale(.4)}50%{transform:translate(calc(var(--fx) * .45),calc(var(--fy) * .45 - 150px)) scale(1.15)}80%{transform:translateY(-14px)}100%{transform:none}}
.se .item.got{animation:se-got .32s ease forwards}@keyframes se-got{to{transform:translateY(-130px) scale(.5);opacity:0}}
.se .glint{transform-origin:50% 50%;animation:se-glint 1.8s ease-in-out infinite}
@keyframes se-glint{0%,60%,100%{opacity:0;transform:scale(.3)}75%{opacity:1;transform:scale(1.1) rotate(45deg)}}

/* 문 */
.se .dopen{opacity:0;transition:opacity .6s}.se.f-door .se-room.on .dopen{opacity:1}
.se.f-door .se-room.on .dlamp{fill:#38e07a}
.se .shoot{opacity:0}.se .shoot.go{animation:se-shoot 1s ease-out}
@keyframes se-shoot{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(-320px,170px)}}

/* ① 조종실 · 졸린 외계인 선장 */
.se .alien .abody{transform-origin:50% 100%;animation:se-snore 3s ease-in-out infinite}
@keyframes se-snore{50%{transform:scale(1.04,.97)}}
.se .alien .zzz text{animation:se-z 3s ease-in-out infinite;transform-origin:50% 50%}
.se .alien .zzz text:nth-child(2){animation-delay:.6s}.se .alien .zzz text:nth-child(3){animation-delay:1.2s}
@keyframes se-z{0%{opacity:0;transform:translate(0,10px)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-26px)}}
@keyframes se-peek{0%,100%{opacity:0}15%,70%{opacity:1}}
@keyframes se-peekc{0%,100%{opacity:1}15%,70%{opacity:0}}
.se .alien .as1,.se .alien .as2{opacity:0}
.se .alien.peek .as1{animation:se-peek 1.6s ease forwards}.se .alien.peek .as0{animation:se-peekc 1.6s ease forwards}
.se .alien.achoo .as2{animation:se-peek 1.5s ease forwards}.se .alien.achoo .as0{animation:se-peekc 1.5s ease forwards}
.se .alien.achoo .abody{animation:se-achoo .9s ease}
@keyframes se-achoo{0%{transform:none}35%{transform:translateY(-10px) scale(.95,1.08) rotate(4deg)}50%{transform:scale(1.1,.9) rotate(-8deg)}100%{transform:none}}
.se .alien.inhale .abody{animation:se-inhale 1s ease-in forwards}.se .alien.inhale .as1{opacity:1}.se .alien.inhale .as0{opacity:0}
@keyframes se-inhale{30%{transform:scale(1.03,1.05)}60%{transform:scale(1.06,1.1) rotate(-3deg)}100%{transform:scale(1.1,1.16) rotate(-6deg)}}
.se .alien.achoo .zzz,.se .alien.inhale .zzz{opacity:0}
.se .alien .splat{opacity:0}
.se .alien.achoo .splat{animation:se-splat .8s cubic-bezier(.3,0,.6,1) .45s}
@keyframes se-splat{0%{opacity:1;transform:none}100%{opacity:.9;transform:translate(-250px,60px) scale(1.5)}}
.se.f-zapped .beltcard{display:none}
.se.alarm .sirlamp{animation:se-siren .25s steps(2) infinite}
@keyframes se-siren{50%{fill:#ff2e2e}}
.se.alarm .se-scene::after{content:"";position:absolute;inset:0;background:#ff2020;mix-blend-mode:multiply;animation:se-red .35s steps(2) infinite;pointer-events:none;z-index:3}
